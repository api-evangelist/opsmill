aid: opsmill
name: OpsMill
description: >-
  OpsMill is the company behind Infrahub, an open-source, graph-based
  infrastructure data management platform that unifies a source of truth for
  network, data center, and cloud automation. Infrahub combines a flexible,
  extensible schema, native version control with branching and merging, and
  unified Git + graph-database storage, then exposes that data through a
  GraphQL API, a REST API, a Python SDK, the infrahubctl CLI, a web UI, and a
  Model Context Protocol (MCP) server so both automation pipelines and AI
  agents can query, propose, and review infrastructure changes with peer
  review and CI workflows built in.
